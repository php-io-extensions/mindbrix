name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Matrix jobs all queue at once; macos-15 siblings waiting for a runner were
# cancelled after ~15–27 min. Chain them so only one job is queued at a time.
jobs:
  php84-nts:
    name: PHP 8.4 nts on macos-15
    uses: ./.github/workflows/ci-macos.yml
    with:
      php: '8.4'
      ts: nts

  php84-zts:
    name: PHP 8.4 zts on macos-15
    needs: php84-nts
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/ci-macos.yml
    with:
      php: '8.4'
      ts: zts

  php85-nts:
    name: PHP 8.5 nts on macos-15
    needs: php84-zts
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/ci-macos.yml
    with:
      php: '8.5'
      ts: nts

  php85-zts:
    name: PHP 8.5 zts on macos-15
    needs: php85-nts
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/ci-macos.yml
    with:
      php: '8.5'
      ts: zts
